[package]
name = "jetlag_core"
version = "0.1.0"
edition = "2021"
description = "Cross-platform DNS configuration core library for Jetlag DNS Manager"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "jetlag_core"

[features]
default = []
windows-dns = ["dep:windows"]
linux-dns = ["dep:zbus", "dep:tokio"]
macos-dns = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
flutter_rust_bridge = "=2.11.1"

# Windows DNS (feature-gated)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Dns",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_NetworkManagement_Ndis",
], optional = true }

# Linux DNS via D-Bus (feature-gated)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
